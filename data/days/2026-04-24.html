// ── Candlestick Chart Component ──
function CandlestickChart({ candles, trades, accent, gradientId, startMin = 0 }) {
  const [hoverIdx, setHoverIdx] = useState(null);

  const width = 720;
  const height = 280;
  const margin = { left: 50, right: 12, top: 14, bottom: 24 };
  const chartW = width - margin.left - margin.right;
  const chartH = height - margin.top - margin.bottom;

  const closes = candles.map(c => c.c);
  const calcMA = (period) => closes.map((_, i) => {
    if (i < period - 1) return null;
    const slice = closes.slice(i - period + 1, i + 1);
    return slice.reduce((s, x) => s + x, 0) / period;
  });
  const calcBB = (period) => closes.map((_, i) => {
    if (i < period - 1) return null;
    const slice = closes.slice(i - period + 1, i + 1);
    const avg = slice.reduce((s, x) => s + x, 0) / period;
    const sd = Math.sqrt(slice.reduce((s, x) => s + (x - avg) ** 2, 0) / period);
    return { mid: avg, up1: avg + sd, lo1: avg - sd, up2: avg + 2 * sd, lo2: avg - 2 * sd, up3: avg + 3 * sd, lo3: avg - 3 * sd };
  });
  const ma5 = calcMA(5);
  const bb = calcBB(25);

  const allVals = [];
  candles.forEach(c => { allVals.push(c.h); allVals.push(c.l); });
  bb.forEach(b => { if (b) { allVals.push(b.up3); allVals.push(b.lo3); } });
  ma5.forEach(v => { if (v != null) allVals.push(v); });
  const pmin = Math.min(...allVals);
  const pmax = Math.max(...allVals);
  const pad = (pmax - pmin) * 0.08;
  const yMin = pmin - pad;
  const yMax = pmax + pad;
  const yRange = yMax - yMin;

  const n = candles.length;
  const candleW = chartW / n;
  const bodyW = Math.max(2, candleW * 0.65);

  const xFor = (i) => margin.left + i * candleW + candleW / 2;
  const yFor = (p) => margin.top + ((yMax - p) / yRange) * chartH;
  const timeFor = (i) => {
    const total = (9 * 60) + startMin + i;
    return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
  };

  const bandPath = (upKey, loKey) => {
    const top = [];
    const bot = [];
    bb.forEach((b, i) => {
      if (!b) return;
      top.push([xFor(i), yFor(b[upKey])]);
      bot.push([xFor(i), yFor(b[loKey])]);
    });
    if (top.length < 2) return '';
    let d = `M ${top.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' L ')}`;
    d += ` L ${bot.reverse().map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' L ')} Z`;
    return d;
  };

  const linePath = (values) => {
    const pts = [];
    values.forEach((v, i) => { if (v != null) pts.push([xFor(i), yFor(v)]); });
    if (pts.length < 2) return '';
    return `M ${pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' L ')}`;
  };

  const bbLine = (key) => linePath(bb.map(b => b ? b[key] : null));

  return (
    <div style={{ position: 'relative' }}>
      <svg viewBox={`0 0 ${width} ${height}`} style={{ width: '100%', height: 'auto', display: 'block' }}
        onMouseLeave={() => setHoverIdx(null)}
      >
        <defs>
          <linearGradient id={gradientId} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={accent} stopOpacity="0.18" />
            <stop offset="100%" stopColor={accent} stopOpacity="0.02" />
          </linearGradient>
        </defs>

        {[0, 1, 2, 3, 4, 5].map(i => {
          const y = margin.top + (i / 5) * chartH;
          const price = yMax - (i / 5) * yRange;
          return (
            <g key={`grid-${i}`}>
              <line x1={margin.left} y1={y} x2={margin.left + chartW} y2={y}
                stroke="rgba(255,255,255,0.04)" strokeWidth="0.5" strokeDasharray="2,4" />
              <text x={margin.left - 6} y={y} fill="#64748b" fontSize="10"
                textAnchor="end" dominantBaseline="middle"
                fontFamily="ui-monospace, SFMono-Regular, Menlo, monospace">
                {Math.round(price).toLocaleString()}
              </text>
            </g>
          );
        })}

        {candles.map((_, i) => {
          if (i % 5 !== 0) return null;
          return (
            <text key={`x-${i}`} x={xFor(i)} y={margin.top + chartH + 14}
              fill="#64748b" fontSize="9.5" textAnchor="middle"
              fontFamily="ui-monospace, monospace">
              {timeFor(i)}
            </text>
          );
        })}

        <path d={bandPath('up3', 'lo3')} fill="rgba(248,113,113,0.04)" />
        <path d={bandPath('up2', 'lo2')} fill="rgba(74,222,128,0.05)" />
        <path d={bandPath('up1', 'lo1')} fill="rgba(134,239,172,0.06)" />

        <path d={bbLine('up3')} fill="none" stroke="#f87171" strokeWidth="0.8" strokeDasharray="2,4" opacity="0.5" />
        <path d={bbLine('lo3')} fill="none" stroke="#f87171" strokeWidth="0.8" strokeDasharray="2,4" opacity="0.5" />
        <path d={bbLine('up2')} fill="none" stroke="#4ade80" strokeWidth="0.9" strokeDasharray="3,3" opacity="0.55" />
        <path d={bbLine('lo2')} fill="none" stroke="#4ade80" strokeWidth="0.9" strokeDasharray="3,3" opacity="0.55" />
        <path d={bbLine('up1')} fill="none" stroke="#86efac" strokeWidth="1" strokeDasharray="4,2" opacity="0.6" />
        <path d={bbLine('lo1')} fill="none" stroke="#86efac" strokeWidth="1" strokeDasharray="4,2" opacity="0.6" />
        <path d={bbLine('mid')} fill="none" stroke="#94a3b8" strokeWidth="1" strokeDasharray="5,2" opacity="0.55" />

        <path d={linePath(ma5)} fill="none" stroke="#facc15" strokeWidth="1.6" opacity="0.85"
          style={{ filter: 'drop-shadow(0 0 4px rgba(250, 204, 21, 0.3))' }} />

        {/* Trade vertical reference lines */}
        {trades.map((t, idx) => {
          const tMin = (parseInt(t.time.split(':')[0]) * 60 + parseInt(t.time.split(':')[1])) - (9 * 60 + startMin);
          if (tMin < 0 || tMin >= n) return null;
          const x = xFor(tMin);
          const color = t.result === 'win' ? '#22c55e' : '#ef4444';
          return (
            <line key={`ref-${idx}`} x1={x} y1={margin.top} x2={x} y2={margin.top + chartH}
              stroke={color} strokeWidth="1" strokeDasharray="2,4" opacity="0.35" />
          );
        })}

        {/* Candles */}
        {candles.map((c, i) => {
          const x = xFor(i);
          const isUp = c.c >= c.o;
          const color = isUp ? '#22c55e' : '#ef4444';
          const bodyTop = Math.min(yFor(c.o), yFor(c.c));
          const bodyH = Math.max(1, Math.abs(yFor(c.c) - yFor(c.o)));
          return (
            <g key={`c-${i}`}
              onMouseEnter={() => setHoverIdx(i)}
              style={{ cursor: 'pointer' }}>
              <rect x={x - candleW / 2} y={margin.top} width={candleW} height={chartH}
                fill="transparent" />
              <line x1={x} y1={yFor(c.h)} x2={x} y2={yFor(c.l)}
                stroke={color} strokeWidth="1" />
              <rect x={x - bodyW / 2} y={bodyTop} width={bodyW} height={bodyH}
                fill={color} rx="0.5" />
            </g>
          );
        })}

        {/* Trade markers - placed in margins, not over candles */}
        {trades.map((t, idx) => {
          const tMin = (parseInt(t.time.split(':')[0]) * 60 + parseInt(t.time.split(':')[1])) - (9 * 60 + startMin);
          if (tMin < 0 || tMin >= n) return null;
          const x = xFor(tMin);
          const isBuy = t.side === 'buy';
          const color = t.result === 'win' ? '#22c55e' : '#ef4444';
          const sym = isBuy ? '▲' : '▼';
          // Buy markers: pinned just below price (in lower margin area)
          // Sell markers: pinned just above price (in upper margin area)  
          // Use price y but offset further so they don't overlap candles
          const y = yFor(t.price);
          const markerY = isBuy ? y + 22 : y - 22;
          const symY = isBuy ? markerY + 5 : markerY - 5;
          const numY = isBuy ? markerY + 17 : markerY - 17;
          return (
            <g key={`m-${idx}`} style={{ pointerEvents: 'none' }}>
              {/* Connector line from candle to marker */}
              <line x1={x} y1={y} x2={x} y2={markerY} stroke={color} strokeWidth="1" opacity="0.5" />
              {/* Marker symbol */}
              <text x={x} y={symY} fill={color} fontSize="13" fontWeight="bold"
                textAnchor="middle">{sym}</text>
              {/* Number badge */}
              <circle cx={x} cy={numY} r="8" fill="#080d18" stroke={color} strokeWidth="1.2" />
              <text x={x} y={numY + 1} fill={color} fontSize="10" fontWeight="bold"
                textAnchor="middle" dominantBaseline="middle"
                fontFamily="ui-monospace, monospace">{t.num}</text>
            </g>
          );
        })}

        {/* Hover tooltip */}
        {hoverIdx !== null && candles[hoverIdx] && (() => {
          const c = candles[hoverIdx];
          const x = xFor(hoverIdx);
          const tipX = x > chartW / 2 + margin.left ? x - 130 : x + 12;
          const tipY = margin.top + 8;
          return (
            <g style={{ pointerEvents: 'none' }}>
              <line x1={x} y1={margin.top} x2={x} y2={margin.top + chartH}
                stroke="rgba(255,255,255,0.15)" strokeWidth="0.5" />
              <rect x={tipX} y={tipY} width="118" height="92" rx="6"
                fill="rgba(10, 15, 30, 0.95)" stroke="#1e293b" strokeWidth="1" />
              <text x={tipX + 8} y={tipY + 16} fill="#a78bfa" fontSize="10" fontWeight="bold">{timeFor(hoverIdx)}</text>
              <text x={tipX + 8} y={tipY + 32} fill="#94a3b8" fontSize="9.5">始値</text>
              <text x={tipX + 110} y={tipY + 32} fill="#e2e8f0" fontSize="9.5" textAnchor="end" fontFamily="monospace">{c.o.toLocaleString()}</text>
              <text x={tipX + 8} y={tipY + 46} fill="#94a3b8" fontSize="9.5">高値</text>
              <text x={tipX + 110} y={tipY + 46} fill="#22c55e" fontSize="9.5" textAnchor="end" fontFamily="monospace">{c.h.toLocaleString()}</text>
              <text x={tipX + 8} y={tipY + 60} fill="#94a3b8" fontSize="9.5">安値</text>
              <text x={tipX + 110} y={tipY + 60} fill="#ef4444" fontSize="9.5" textAnchor="end" fontFamily="monospace">{c.l.toLocaleString()}</text>
              <text x={tipX + 8} y={tipY + 76} fill="#94a3b8" fontSize="9.5">終値</text>
              <text x={tipX + 110} y={tipY + 76} fill={c.c >= c.o ? '#22c55e' : '#ef4444'} fontSize="9.5" textAnchor="end" fontFamily="monospace">{c.c.toLocaleString()}</text>
            </g>
          );
        })()}
      </svg>
    </div>
  );
}

function KPI({ label, value, sub, tone }) {
  const color = tone === 'good' ? '#4ade80' : tone === 'bad' ? '#fb7185' : '#e2e8f0';
  return (
    <div style={{
      background: 'linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01))',
      border: '1px solid rgba(255,255,255,0.06)',
      borderRadius: 14,
      padding: '12px 14px',
      backdropFilter: 'blur(10px)',
    }}>
      <div style={{ fontSize: 10, color: '#64748b', marginBottom: 4, letterSpacing: 0.5 }}>{label}</div>
      <div style={{ fontSize: 19, fontWeight: 700, color, fontFamily: 'ui-monospace, monospace', lineHeight: 1.1 }}>{value}</div>
      <div style={{ fontSize: 9.5, color: '#475569', marginTop: 3 }}>{sub}</div>
    </div>
  );
}

function TradeCard({ trade, expanded, onToggle }) {
  const isWin = trade.pnl >= 0;
  const color = isWin ? '#4ade80' : '#fb7185';
  const bgGrad = isWin
    ? 'linear-gradient(180deg, rgba(74,222,128,0.06), rgba(74,222,128,0.01))'
    : 'linear-gradient(180deg, rgba(251,113,133,0.06), rgba(251,113,133,0.01))';
  const borderColor = isWin ? 'rgba(74,222,128,0.18)' : 'rgba(251,113,133,0.18)';

  return (
    <div
      onClick={onToggle}
      style={{
        flex: 1,
        background: bgGrad,
        border: `1px solid ${borderColor}`,
        borderRadius: 14,
        padding: '11px 13px',
        cursor: 'pointer',
        transition: 'all 0.25s ease',
        transform: expanded ? 'translateY(-1px)' : 'none',
        boxShadow: expanded ? `0 6px 20px ${isWin ? 'rgba(74,222,128,0.08)' : 'rgba(251,113,133,0.08)'}` : 'none',
      }}
    >
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
        <span style={{ fontSize: 10.5, color: '#94a3b8', lineHeight: 1.4 }}>{trade.label}</span>
        <span style={{
          fontSize: 9, color: '#cbd5e1',
          background: 'rgba(255,255,255,0.06)',
          padding: '2px 7px', borderRadius: 999,
          letterSpacing: 0.3,
        }}>{trade.tag}</span>
      </div>
      <div style={{ fontSize: 17, fontWeight: 700, color, fontFamily: 'ui-monospace, monospace', lineHeight: 1.1 }}>
        {trade.pnl >= 0 ? '+' : ''}{trade.pnl.toLocaleString()}円
      </div>
      <div style={{
        maxHeight: expanded ? 200 : 22,
        overflow: 'hidden',
        transition: 'max-height 0.3s ease',
      }}>
        <div style={{ fontSize: 10.5, color: '#64748b', marginTop: 5, lineHeight: 1.55 }}>
          {trade.note}
        </div>
        {expanded && trade.detail && (
          <div style={{ fontSize: 10.5, color: '#94a3b8', marginTop: 8, lineHeight: 1.65 }}>
            {trade.detail}
          </div>
        )}
      </div>
    </div>
  );
}
