name: Fetch price data

on:
  push:
    branches: [main]
    paths:
      - 'data/*.csv'
      - 'scripts/fetch-prices.mjs'
      - '.github/workflows/fetch-prices.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch price data from Yahoo Finance
        run: node scripts/fetch-prices.mjs

      - name: Commit and push price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices/
          if git diff --staged --quiet; then
            echo "No new price data to commit"
          else
            git commit -m "🤖 Auto-update price data"
            git push
          fi
