<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daytrade Journal</title>
<style>
  :root {
    --bg: #080d18;
    --surface: rgba(255,255,255,0.03);
    --border: #1a2235;
    --text: #e2e8f0;
    --muted: #475569;
    --dim: #334155;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #facc15;
    --blue: #60a5fa;
    --purple: #a78bfa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    min-height: 100vh;
  }
  .container { max-width: 720px; margin: 0 auto; padding: 14px; }
  .upload-bar {
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .upload-bar label {
    background: rgba(96,165,250,0.1);
    border: 1px solid rgba(96,165,250,0.3);
    color: var(--blue);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    font-weight: bold;
  }
  .upload-bar input[type=file] { display: none; }
  .upload-bar .info { font-size: 11px; color: var(--muted); flex: 1; }

  .header {
    display: flex; justify-content: space-between; align-items: flex-start;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px; margin-bottom: 12px;
  }
  .header .label { font-size: 9px; color: var(--dim); letter-spacing: 3px; margin-bottom: 2px; }
  .header .date { font-size: 17px; font-weight: bold; }
  .header .meta { font-size: 9px; color: var(--muted); }
  .header .pnl-label { font-size: 9px; color: var(--muted); margin-bottom: 2px; text-align: right; }
  .header .pnl { font-size: 24px; font-weight: bold; font-family: monospace; line-height: 1; text-align: right; }

  .kpi-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px;
  }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
  }
  .kpi .lbl { font-size: 9px; color: var(--muted); margin-bottom: 2px; }
  .kpi .val { font-size: 16px; font-weight: bold; font-family: monospace; line-height: 1; }
  .kpi .sub { font-size: 9px; color: var(--dim); margin-top: 2px; }

  .stock-section { margin-bottom: 18px; }
  .stock-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px;
  }
  .stock-name { font-size: 14px; font-weight: bold; }
  .stock-meta { font-size: 9px; color: var(--dim); margin-left: 8px; }
  .stock-pnl { font-size: 14px; font-weight: bold; font-family: monospace; }

  .chart-area {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    height: 280px;
    position: relative;
    margin-bottom: 8px;
  }
  .chart-legend {
    display: flex; flex-wrap: wrap; gap: 4px 12px;
    font-size: 9px; color: var(--muted);
    padding: 0 4px 6px;
  }
  .chart-legend .item { display: flex; align-items: center; gap: 4px; }
  .chart-legend .swatch { width: 14px; height: 2px; display: inline-block; }
  .chart-legend .swatch.dashed {
    background: repeating-linear-gradient(90deg, currentColor 0, currentColor 2px, transparent 2px, transparent 5px);
  }

  .trade-cards { display: flex; gap: 6px; flex-wrap: wrap; }
  .trade-card {
    flex: 1 1 200px;
    background: var(--surface);
    border-radius: 6px;
    padding: 6px 9px;
  }
  .trade-card.win { border: 1px solid rgba(34,197,94,0.25); }
  .trade-card.loss { border: 1px solid rgba(239,68,68,0.25); }
  .trade-card .lbl { font-size: 9px; color: var(--muted); margin-bottom: 3px; }
  .trade-card .val { font-size: 16px; font-weight: bold; font-family: monospace; }
  .trade-card .val.win { color: var(--green); }
  .trade-card .val.loss { color: var(--red); }
  .trade-card .note { font-size: 9px; color: var(--dim); margin-top: 3px; }
  .trade-card .trip-header {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 4px;
  }
  .trade-card .trip-num {
    background: rgba(255,255,255,0.08);
    color: var(--text);
    font-size: 10px;
    font-weight: bold;
    width: 18px; height: 18px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
  }
  .trade-card .trip-detail {
    font-size: 11px;
    color: var(--text);
    font-family: monospace;
  }

  .empty {
    text-align: center; padding: 40px 20px;
    color: var(--muted);
  }
  .empty h2 { font-size: 16px; margin: 0 0 8px; color: var(--text); }
  .empty p { font-size: 12px; line-height: 1.6; margin: 0; }

  .green { color: var(--green); }
  .red { color: var(--red); }

  /* Chart SVG styles */
  .chart-svg { width: 100%; height: 100%; display: block; }
  .axis-label { fill: var(--dim); font-size: 9px; font-family: monospace; }
  .grid-line { stroke: rgba(255,255,255,0.05); stroke-dasharray: 2 4; }
  .price-line { fill: none; stroke-width: 2; }
  .marker-buy { fill: var(--green); stroke: white; stroke-width: 1.5; }
  .marker-sell { fill: var(--red); stroke: white; stroke-width: 1.5; }
  .marker-buy-loss { fill: var(--red); }
  .marker-sell-win { fill: var(--green); }
  .trade-vline { stroke-dasharray: 3 3; stroke-width: 1; opacity: 0.5; }
  .trade-label {
    font-size: 9px; font-family: monospace; font-weight: bold;
  }

  details {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 12px;
    padding: 8px 12px;
  }
  details summary {
    font-size: 11px; color: var(--muted); cursor: pointer; user-select: none;
    list-style: none;
  }
  details summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  details .raw-table {
    margin-top: 8px;
    font-size: 10px;
    width: 100%;
    border-collapse: collapse;
  }
  details .raw-table th, details .raw-table td {
    padding: 3px 6px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    font-family: monospace;
  }
  details .raw-table th { color: var(--muted); font-weight: normal; font-size: 9px; }

  .chart-placeholder-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 30px 16px;
    text-align: center;
    margin-bottom: 8px;
  }

  /* Time editor (per-stock) */
  details.time-editor {
    margin-top: 8px;
    background: rgba(255,255,255,0.02);
    border-radius: 4px;
    padding: 6px 10px;
  }
  details.time-editor summary {
    font-size: 10px;
    color: var(--muted);
    cursor: pointer;
  }
  .time-editor-body { margin-top: 8px; }
  .time-editor-hint {
    font-size: 9px;
    color: var(--dim);
    margin-bottom: 8px;
    line-height: 1.5;
  }
  .time-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 0;
    flex-wrap: wrap;
  }
  .time-label {
    flex: 1 1 100%;
    font-size: 10px;
    color: var(--text);
    font-family: monospace;
  }
  .time-input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 6px;
    border-radius: 4px;
    font-size: 12px;
    font-family: monospace;
    width: 100px;
  }
  .time-input:focus { outline: none; border-color: var(--blue); }
  .time-sep { font-size: 11px; color: var(--muted); }

  /* Sticky save bar */
  .save-bar {
    position: sticky;
    bottom: 8px;
    z-index: 10;
    background: linear-gradient(135deg, rgba(96,165,250,0.18), rgba(167,139,250,0.18));
    border: 1px solid rgba(96,165,250,0.4);
    border-radius: 8px;
    padding: 10px 12px;
    margin: 14px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    backdrop-filter: blur(10px);
  }
  .save-bar-text {
    font-size: 11px;
    color: var(--text);
    font-weight: bold;
  }
  .save-bar-actions { display: flex; gap: 6px; }
  .save-btn {
    background: var(--blue);
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    font-weight: bold;
  }
  .save-btn.secondary {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .save-btn:active { opacity: 0.8; }

  /* Chart image area */
  .chart-image-area {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 8px;
    min-height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chart-image {
    width: 100%;
    height: auto;
    display: block;
  }
  .chart-placeholder {
    text-align: center;
    padding: 30px 16px;
    color: var(--muted);
  }
  .chart-placeholder-icon {
    font-size: 28px;
    margin-bottom: 8px;
    opacity: 0.6;
  }
  .chart-placeholder-text {
    font-size: 10px;
    color: var(--dim);
    line-height: 1.5;
  }
  .chart-placeholder-text code {
    background: rgba(255,255,255,0.06);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 9.5px;
    color: var(--text);
  }

  /* Per-stock note (inside stock section) */
  .stock-note {
    background: rgba(96, 165, 250, 0.04);
    border-left: 3px solid var(--blue);
    border-radius: 4px;
    padding: 10px 12px;
    margin-top: 10px;
  }
  .stock-note-title {
    font-size: 11px;
    color: var(--blue);
    margin-bottom: 6px;
    font-weight: bold;
  }
  .stock-note .notes-rendered {
    font-size: 12px;
    line-height: 1.6;
  }

  /* Notes section */
  .notes-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin: 16px 0;
  }
  .notes-section .section-title {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
    letter-spacing: 1px;
  }
  .notes-rendered {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
  }
  .notes-rendered h1, .notes-rendered h2, .notes-rendered h3 {
    margin: 14px 0 6px;
    color: var(--text);
  }
  .notes-rendered h1 { font-size: 16px; }
  .notes-rendered h2 { font-size: 14px; color: var(--blue); }
  .notes-rendered h3 { font-size: 12px; color: var(--purple); }
  .notes-rendered p { margin: 6px 0; }
  .notes-rendered ul, .notes-rendered ol {
    margin: 6px 0; padding-left: 20px;
  }
  .notes-rendered li { margin: 3px 0; }
  .notes-rendered code {
    background: rgba(255,255,255,0.06);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 11px;
    color: #facc15;
  }
  .notes-rendered pre {
    background: rgba(0,0,0,0.3);
    padding: 10px;
    border-radius: 4px;
    overflow-x: auto;
    font-size: 11px;
  }
  .notes-rendered pre code {
    background: none; padding: 0; color: var(--text);
  }
  .notes-rendered blockquote {
    border-left: 3px solid var(--blue);
    padding: 4px 10px;
    margin: 8px 0;
    color: var(--muted);
    background: rgba(96,165,250,0.05);
  }
  .notes-rendered hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 12px 0;
  }
  .notes-rendered strong { color: #facc15; }
  .notes-empty {
    text-align: center;
    padding: 24px 12px;
    color: var(--muted);
  }
  .notes-empty-icon { font-size: 28px; margin-bottom: 8px; opacity: 0.6; }
  .notes-empty-text { font-size: 12px; margin-bottom: 6px; color: var(--dim); }
  .notes-empty-hint { font-size: 10px; color: var(--dim); line-height: 1.6; }
  .notes-empty-hint code {
    background: rgba(255,255,255,0.06);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 9.5px;
    color: var(--text);
  }

  .footer {
    text-align: center;
    margin-top: 20px;
    padding-top: 14px;
    font-size: 10px;
    color: var(--dim);
    border-top: 1px solid var(--border);
  }
  .footer a { color: var(--muted); text-decoration: none; }
</style>
</head>
<body>
<div class="container">

  <a href="index.html" style="display:inline-block; font-size:11px; color:var(--muted); text-decoration:none; margin-bottom:10px;">← トップに戻る</a>

  <div class="upload-bar">
    <label for="csvfile">📂 CSVを選択</label>
    <input type="file" id="csvfile" accept=".csv,text/csv" />
    <span class="info" id="status">SBI証券の約定履歴CSVを読み込みます…</span>
  </div>

  <div id="app"></div>

  <div class="footer">
    Daytrade Journal · <a href="https://github.com/" target="_blank">GitHub</a>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// CSV Parser - supports both 信用決済明細 (preferred) and 約定履歴照会
// ═══════════════════════════════════════════════════════════════════
function parseCsvLine(line) {
  const fields = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') inQ = !inQ;
    else if (c === ',' && !inQ) { fields.push(cur); cur = ''; }
    else cur += c;
  }
  fields.push(cur);
  return fields.map(f => f.trim());
}

async function parseSBICsv(buffer) {
  // Try multiple encodings
  const encodings = ['utf-8', 'shift-jis', 'euc-jp'];
  let text = null, usedEnc = null;
  for (const enc of encodings) {
    try {
      const decoder = new TextDecoder(enc, { fatal: false });
      const decoded = decoder.decode(buffer);
      if (decoded.includes('銘柄') && (decoded.includes('決済日') || decoded.includes('約定日'))) {
        text = decoded;
        usedEnc = enc;
        break;
      }
    } catch (e) {}
  }
  if (!text) throw new Error('CSVのエンコーディングを判別できませんでした');
  console.log(`CSV decoded as ${usedEnc}`);

  const lines = text.split(/\r?\n/);

  // Detect format type: 信用決済明細 (preferred) or 約定履歴照会
  const isCloseDetail = text.includes('信用決済明細') || lines.some(l => l.startsWith('決済日'));

  if (isCloseDetail) {
    return parseCloseDetailCsv(lines);
  } else {
    return parseTradeHistoryCsv(lines);
  }
}

// Parse 信用決済明細 (close detail) format - PREFERRED
function parseCloseDetailCsv(lines) {
  const headerIdx = lines.findIndex(l => l.startsWith('決済日'));
  if (headerIdx < 0) throw new Error('CSVヘッダー（決済日）が見つかりません');

  const dataLines = lines.slice(headerIdx + 1).filter(l => l.trim() && l.includes('"'));

  // Each line is one round-trip (open + close pair)
  // Columns: 決済日,銘柄,銘柄コード,決済市場,取引,期限,預り,課税,建市場,建日,買/売建,
  //          決済数量,建単価,決済単価,建代金,決済代金,...,受渡日,受渡金額/決済損益
  const trades = [];
  dataLines.forEach((line, idx) => {
    const f = parseCsvLine(line);
    if (f.length < 28) return;
    const [date, name, code, , action, , , , , , buySellOpen, qty, openPrice, closePrice] = f.map(x => x.replace(/^"|"$/g, ''));
    const pnl = parseFloat(f[27].replace(/^"|"$/g, '').replace(/[+,]/g, ''));
    const isLong = buySellOpen.includes('買');
    const code4 = code.trim();

    // Generate two synthetic trades (open + close) per round-trip
    const baseIdx = idx * 2;
    trades.push({
      idx: baseIdx,
      tripId: idx,
      date: date.replace(/\//g, '-'),
      name: name.trim(),
      code: code4,
      action: isLong ? '信用新規買' : '信用新規売',
      isOpen: true, isClose: false,
      isBuy: isLong, isSell: !isLong,
      qty: parseInt(qty, 10),
      price: parseFloat(openPrice),
      pnl: null,
    });
    trades.push({
      idx: baseIdx + 1,
      tripId: idx,
      date: date.replace(/\//g, '-'),
      name: name.trim(),
      code: code4,
      action: isLong ? '信用返済売' : '信用返済買',
      isOpen: false, isClose: true,
      isBuy: !isLong, isSell: isLong,
      qty: parseInt(qty, 10),
      price: parseFloat(closePrice),
      pnl: isNaN(pnl) ? null : pnl,
    });
  });

  return trades;
}

// Parse 約定履歴照会 (trade history) format - LEGACY
function parseTradeHistoryCsv(lines) {
  const headerIdx = lines.findIndex(l => l.startsWith('約定日'));
  if (headerIdx < 0) throw new Error('CSVヘッダー（約定日）が見つかりません');

  const dataLines = lines.slice(headerIdx + 1).filter(l => l.trim() && l.includes('"'));

  return dataLines.map((line, idx) => {
    const fields = parseCsvLine(line).map(f => f.replace(/^"|"$/g, ''));
    const [date, name, code, market, action, term, custody, tax, qty, price, fee, taxAmt, settle, pnl] = fields;
    return {
      idx,
      tripId: null,
      date: date.replace(/\//g, '-'),
      name,
      code: code.trim(),
      action,
      isOpen: action.includes('新規'),
      isClose: action.includes('返済'),
      isBuy: action.includes('買'),
      isSell: action.includes('売'),
      qty: parseInt(qty, 10),
      price: parseFloat(price),
      pnl: pnl === '--' ? null : parseFloat(pnl),
    };
  });
}

// ═══════════════════════════════════════════════════════════════════
// Trade Aggregation
// ═══════════════════════════════════════════════════════════════════
function aggregateByStock(trades) {
  const byStock = {};
  trades.forEach(t => {
    if (!byStock[t.code]) {
      byStock[t.code] = {
        code: t.code,
        name: t.name,
        trades: [],
        opens: [],
        closes: [],
        totalPnL: 0,
        totalQty: 0,
      };
    }
    const s = byStock[t.code];
    s.trades.push(t);
    if (t.isOpen) s.opens.push(t);
    if (t.isClose) s.closes.push(t);
    if (t.pnl !== null) s.totalPnL += t.pnl;
    s.totalQty = Math.max(s.totalQty, s.opens.reduce((a,b) => a+b.qty, 0));
  });

  // Calculate weighted average open and close prices
  Object.values(byStock).forEach(s => {
    const sumOpen = s.opens.reduce((a,b) => a + b.qty * b.price, 0);
    const qOpen = s.opens.reduce((a,b) => a + b.qty, 0);
    s.avgOpen = qOpen ? +(sumOpen/qOpen).toFixed(2) : null;

    const sumClose = s.closes.reduce((a,b) => a + b.qty * b.price, 0);
    const qClose = s.closes.reduce((a,b) => a + b.qty, 0);
    s.avgClose = qClose ? +(sumClose/qClose).toFixed(2) : null;

    // Direction from first open
    if (s.opens.length > 0) {
      s.direction = s.opens[0].isBuy ? 'long' : 'short';
    }
  });

  return Object.values(byStock);
}

function calcKPIs(trades, stocks) {
  const closingTrades = trades.filter(t => t.pnl !== null);
  const wins = closingTrades.filter(t => t.pnl > 0);
  const losses = closingTrades.filter(t => t.pnl < 0);
  const totalPnL = closingTrades.reduce((a,b) => a + b.pnl, 0);
  const winRate = closingTrades.length ? (wins.length / closingTrades.length * 100) : 0;
  const avgWin = wins.length ? wins.reduce((a,b) => a + b.pnl, 0) / wins.length : 0;
  const avgLoss = losses.length ? Math.abs(losses.reduce((a,b) => a + b.pnl, 0) / losses.length) : 0;
  const payoff = avgLoss > 0 ? (avgWin / avgLoss) : null;
  return { totalPnL, winRate, avgWin, avgLoss, payoff, count: closingTrades.length };
}

// ═══════════════════════════════════════════════════════════════════
// Price data loading & indicators
// ═══════════════════════════════════════════════════════════════════
async function loadPriceData(date, code) {
  try {
    const res = await fetch(`data/prices/${date}/${code}.json`);
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

// Load manual time mapping if available
// Format: { "code": { "tripId_or_idx": "HH:MM", ... } }
async function loadTimesData(date) {
  try {
    const res = await fetch(`data/times/${date}.json`);
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

// Load review notes if available
// Format options:
//   1. JSON: { "stocks": { "6857": "markdown...", "9984": "markdown..." }, "overall": "markdown..." }
//   2. JSON (legacy single field): { "overall": "markdown..." }
//   3. Plain markdown (legacy .md file) - shown as overall only
async function loadNotesData(date) {
  // Try JSON first
  try {
    const res = await fetch(`data/notes/${date}.json`);
    if (res.ok) {
      const data = await res.json();
      return { stocks: data.stocks || {}, overall: data.overall || '' };
    }
  } catch {}
  // Fallback: legacy .md file → treat as overall
  try {
    const res = await fetch(`data/notes/${date}.md`);
    if (res.ok) {
      const text = await res.text();
      return { stocks: {}, overall: text };
    }
  } catch {}
  return null;
}

// Minimal Markdown to HTML (safe subset)
function renderMarkdown(md) {
  if (!md) return '';
  // Escape HTML first
  let html = md.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // Code blocks ```...```
  html = html.replace(/```([\s\S]*?)```/g, (m, code) => `<pre><code>${code.trim()}</code></pre>`);
  // Inline code `...`
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  // Headers
  html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');
  // Bold **...**
  html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  // Italic *...*
  html = html.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  // Lists
  html = html.replace(/^[\-\*]\s+(.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*?<\/li>\n?)+/gs, m => `<ul>${m}</ul>`);
  // Numbered lists
  html = html.replace(/^\d+\.\s+(.+)$/gm, '<li class="num">$1</li>');
  html = html.replace(/(<li class="num">.*?<\/li>\n?)+/gs, m => `<ol>${m.replace(/ class="num"/g, '')}</ol>`);
  // Blockquote
  html = html.replace(/^>\s+(.+)$/gm, '<blockquote>$1</blockquote>');
  // Horizontal rule
  html = html.replace(/^---+$/gm, '<hr>');
  // Line breaks: double newline = paragraph, single = <br>
  const blocks = html.split(/\n\n+/);
  return blocks.map(b => {
    const trimmed = b.trim();
    if (!trimmed) return '';
    if (/^<(h[1-3]|ul|ol|pre|blockquote|hr)/i.test(trimmed)) return trimmed;
    return `<p>${trimmed.replace(/\n/g, '<br>')}</p>`;
  }).join('\n');
}

function calcCandleIndicators(candles, maPeriod = 5, bbPeriod = 25) {
  return candles.map((c, i, arr) => {
    const out = { ...c };
    // 5MA on close
    if (i >= maPeriod - 1) {
      let sum = 0;
      for (let k = i - maPeriod + 1; k <= i; k++) sum += arr[k].c;
      out.ma = sum / maPeriod;
    } else { out.ma = null; }
    // BB on close
    if (i >= bbPeriod - 1) {
      let sum = 0;
      for (let k = i - bbPeriod + 1; k <= i; k++) sum += arr[k].c;
      const avg = sum / bbPeriod;
      let varSum = 0;
      for (let k = i - bbPeriod + 1; k <= i; k++) varSum += (arr[k].c - avg) ** 2;
      const sd = Math.sqrt(varSum / bbPeriod);
      out.bbMid = avg;
      out.bb1u = avg + sd;     out.bb1l = avg - sd;
      out.bb2u = avg + 2 * sd; out.bb2l = avg - 2 * sd;
      out.bb3u = avg + 3 * sd; out.bb3l = avg - 3 * sd;
    }
    return out;
  });
}

// ═══════════════════════════════════════════════════════════════════
// Candlestick chart with BB + 5MA + trade markers
// ═══════════════════════════════════════════════════════════════════
// Match candles to trades in CHRONOLOGICAL ORDER (case C):
// - Process trades in order of orderIdx
// - For each trade, find the earliest candle AFTER the previous trade's candle
//   that touches the trade price (low <= price <= high), with a small tolerance
// - This respects the natural time-sequence of trades
function matchTradesToCandles(trades, candles, manualTimes = null) {
  const sortedTrades = trades.slice().sort((a, b) => a.idx - b.idx);
  const result = new Map();

  // Helper: get minute-of-day for a candle (JST)
  function getCandleMin(c) {
    if (c.t == null) return -1;
    const jst = new Date((c.t + 9 * 3600) * 1000);
    return jst.getUTCHours() * 60 + jst.getUTCMinutes();
  }

  // Default trading window: 9:00 - 10:00 (most trades happen here)
  let windowStart = 0;
  let windowEnd = candles.length;
  for (let i = 0; i < candles.length; i++) {
    const m = getCandleMin(candles[i]);
    if (m >= 9 * 60 && windowStart === 0) windowStart = i;
    if (m >= 10 * 60) { windowEnd = i; break; }
  }

  // If manual times are provided, use them as anchors
  function findCandleByTime(timeStr) {
    if (!timeStr || !/^\d{1,2}:\d{2}$/.test(timeStr)) return -1;
    const [hh, mm] = timeStr.split(':').map(Number);
    const targetMin = hh * 60 + mm;
    let bestI = -1, bestDiff = Infinity;
    for (let i = 0; i < candles.length; i++) {
      const c = candles[i];
      if (c.t == null) continue;
      const candleMin = getCandleMin(c);
      const diff = Math.abs(candleMin - targetMin);
      if (diff < bestDiff) { bestDiff = diff; bestI = i; }
    }
    return bestI;
  }

  let cursor = windowStart;
  for (const t of sortedTrades) {
    // Try manual time override first (no window constraint)
    if (manualTimes) {
      const key = t.tripId != null
        ? `${t.tripId}-${t.isOpen ? 'open' : 'close'}`
        : `${t.idx}`;
      const timeStr = manualTimes[key];
      if (timeStr) {
        const idx = findCandleByTime(timeStr);
        if (idx >= 0) {
          result.set(t.idx, idx);
          cursor = idx;
          continue;
        }
      }
    }

    // Auto-match: search ONLY within 9:00-10:00 window
    let foundIdx = -1;
    for (let i = cursor; i < windowEnd; i++) {
      const c = candles[i];
      if (c.l == null || c.h == null) continue;
      if (c.l <= t.price && t.price <= c.h) {
        foundIdx = i;
        break;
      }
    }

    if (foundIdx < 0) {
      let bestI = cursor, bestDiff = Infinity;
      for (let i = cursor; i < windowEnd; i++) {
        const c = candles[i];
        if (c.h == null || c.l == null) continue;
        const diff = t.price > c.h ? t.price - c.h : t.price < c.l ? c.l - t.price : 0;
        if (diff < bestDiff) { bestDiff = diff; bestI = i; }
      }
      foundIdx = bestI;
    }

    result.set(t.idx, foundIdx);
    cursor = foundIdx;
  }

  return result;
}

function renderCandlestickChart(stock, priceData, accent, manualTimes = null) {
  const allCandles = priceData.candles || [];
  if (allCandles.length === 0) return renderTradeChart(stock, accent);

  const withInd = calcCandleIndicators(allCandles, 5, 25);

  const displayDate = stock.trades[0].date;
  let displayCandles = withInd.filter(c => {
    const jst = new Date((c.t + 9 * 3600) * 1000);
    return jst.toISOString().slice(0, 10) === displayDate;
  });
  if (displayCandles.length === 0) return renderTradeChart(stock, accent);

  // ═══ Fixed zoom: 9:00 - 10:00 (extended if trades go beyond) ═════
  // Step 1: Match trades to candles in chronological order
  const sortedTradesAll = stock.trades.slice().sort((a, b) => a.idx - b.idx);
  const tradeMatchMap = matchTradesToCandles(sortedTradesAll, displayCandles, manualTimes);
  const tradeIndicesFull = sortedTradesAll.map(t => tradeMatchMap.get(t.idx));

  // Step 2: Find candle indices for 9:00 and 10:00
  function findCandleIdxAtTime(hh, mm) {
    const targetMin = hh * 60 + mm;
    for (let i = 0; i < displayCandles.length; i++) {
      const c = displayCandles[i];
      if (c.t == null) continue;
      const jst = new Date((c.t + 9 * 3600) * 1000);
      const candleMin = jst.getUTCHours() * 60 + jst.getUTCMinutes();
      if (candleMin >= targetMin) return i;
    }
    return -1;
  }

  let zoomStart = findCandleIdxAtTime(9, 0);
  let zoomEnd = findCandleIdxAtTime(10, 0);
  if (zoomStart < 0) zoomStart = 0;
  if (zoomEnd < 0) zoomEnd = displayCandles.length;

  // Step 3: Extend window if any trade falls outside 9:00-10:00
  if (tradeIndicesFull.length > 0) {
    const minIdx = Math.min(...tradeIndicesFull);
    const maxIdx = Math.max(...tradeIndicesFull);
    if (minIdx < zoomStart) zoomStart = Math.max(0, minIdx - 3);
    if (maxIdx >= zoomEnd) zoomEnd = Math.min(displayCandles.length, maxIdx + 10);
  }

  const tradeIdxOffset = zoomStart;
  displayCandles = displayCandles.slice(zoomStart, zoomEnd);
  const tradeIndices = tradeIndicesFull.map(i => i - tradeIdxOffset);

  // Y range based on visible candles + BB bands
  const allPrices = [];
  displayCandles.forEach(c => {
    if (c.h != null) allPrices.push(c.h);
    if (c.l != null) allPrices.push(c.l);
    if (c.bb3u != null) allPrices.push(c.bb3u);
    if (c.bb3l != null) allPrices.push(c.bb3l);
  });
  const minP = Math.min(...allPrices);
  const maxP = Math.max(...allPrices);
  const padR_v = (maxP - minP) * 0.04;
  const yMin = minP - padR_v, yMax = maxP + padR_v;

  const W = 680, H = 280;
  const padL = 54, padTop = 10, padBot = 26, padR = 10;
  const innerW = W - padL - padR;
  const innerH = H - padTop - padBot;

  const xPos = i => padL + (displayCandles.length === 1 ? innerW / 2 : (i / (displayCandles.length - 1)) * innerW);
  const yPos = p => padTop + innerH - ((p - yMin) / (yMax - yMin)) * innerH;

  // BB band paths (filled regions)
  const bbPath = (upKey, loKey) => {
    let p = '';
    let started = false;
    for (let i = 0; i < displayCandles.length; i++) {
      const c = displayCandles[i];
      if (c[upKey] == null) continue;
      const x = xPos(i), y = yPos(c[upKey]);
      p += (started ? ' L' : 'M') + ` ${x} ${y}`;
      started = true;
    }
    for (let i = displayCandles.length - 1; i >= 0; i--) {
      const c = displayCandles[i];
      if (c[loKey] == null) continue;
      p += ` L ${xPos(i)} ${yPos(c[loKey])}`;
    }
    p += ' Z';
    return p;
  };

  const bbLine = (key, color, dash) => {
    let p = '';
    let started = false;
    for (let i = 0; i < displayCandles.length; i++) {
      const c = displayCandles[i];
      if (c[key] == null) continue;
      const x = xPos(i), y = yPos(c[key]);
      p += (started ? ' L' : 'M') + ` ${x} ${y}`;
      started = true;
    }
    return `<path d="${p}" stroke="${color}" stroke-width="0.8" fill="none" stroke-dasharray="${dash}"/>`;
  };

  // Price line + filled area (smoother than candles)
  let priceLine = '', priceArea = '';
  let started = false;
  displayCandles.forEach((c, i) => {
    if (c.c == null) return;
    const x = xPos(i), y = yPos(c.c);
    priceLine += (started ? ' L' : 'M') + ` ${x} ${y}`;
    if (!started) priceArea = `M ${x} ${padTop + innerH} L ${x} ${y}`;
    else priceArea += ` L ${x} ${y}`;
    started = true;
  });
  if (started) {
    const lastX = xPos(displayCandles.length - 1);
    priceArea += ` L ${lastX} ${padTop + innerH} Z`;
  }

  // Candlesticks (drawn on top of price area for clearer OHLC info)
  const candleW = Math.max(1.5, (innerW / displayCandles.length) * 0.55);
  const candlesHtml = displayCandles.map((c, i) => {
    if (c.h == null || c.l == null || c.o == null || c.c == null) return '';
    const x = xPos(i);
    const isUp = c.c >= c.o;
    const color = isUp ? '#22c55e' : '#ef4444';
    const wickY1 = yPos(c.h);
    const wickY2 = yPos(c.l);
    const bodyTop = yPos(Math.max(c.o, c.c));
    const bodyBot = yPos(Math.min(c.o, c.c));
    const bodyH = Math.max(0.8, bodyBot - bodyTop);
    return `<line x1="${x}" y1="${wickY1}" x2="${x}" y2="${wickY2}" stroke="${color}" stroke-width="1" opacity="0.85"/><rect x="${x - candleW/2}" y="${bodyTop}" width="${candleW}" height="${bodyH}" fill="${color}" opacity="0.85"/>`;
  }).join('');

  // 5MA line
  let maPath = '';
  let maStarted = false;
  displayCandles.forEach((c, i) => {
    if (c.ma == null) return;
    const x = xPos(i), y = yPos(c.ma);
    maPath += (maStarted ? ' L' : 'M') + ` ${x} ${y}`;
    maStarted = true;
  });


  // Trade markers - placed at top of chart area for clarity
  // Number them by round trip group for cross-reference with cards
  const markerTopY = padTop + 8;
  // Build trip-to-trades map for numbering
  const tradeToTrip = new Map();
  // Re-run the same FIFO logic to know which trip each trade belongs to
  // (We can't easily share state, so we just re-derive it here)
  // Simpler: assign by order — each open/close pair gets next number
  let openCount = 0, closeCount = 0;
  const openNumByIdx = new Map();
  const closeNumByIdx = new Map();
  sortedTradesAll.forEach(t => {
    if (t.isOpen) {
      openCount++;
      openNumByIdx.set(t.idx, openCount);
    } else if (t.isClose) {
      closeCount++;
      closeNumByIdx.set(t.idx, closeCount);
    }
  });

  const tradeMarkers = sortedTradesAll.map((t, idx) => {
    const ci = tradeIndices[idx];
    if (ci < 0 || ci >= displayCandles.length) return '';
    const x = xPos(ci);
    const yPrice = yPos(t.price);
    const isWin = t.pnl !== null && t.pnl > 0;
    const isLoss = t.pnl !== null && t.pnl < 0;
    const color = isWin ? '#22c55e' : isLoss ? '#ef4444' : (t.isOpen ? '#94a3b8' : '#94a3b8');
    const sym = t.isBuy ? '▲' : '▼';
    const num = t.isOpen ? openNumByIdx.get(t.idx) : closeNumByIdx.get(t.idx);
    const numLabel = num ? `${num}` : '';
    return `
      <line x1="${x}" y1="${padTop+18}" x2="${x}" y2="${padTop+innerH}" stroke="${color}" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
      <circle cx="${x}" cy="${yPrice}" r="3" fill="${color}" stroke="#080d18" stroke-width="1.5"/>
      <text x="${x}" y="${markerTopY+5}" fill="${color}" font-size="14" text-anchor="middle" font-weight="bold">${sym}</text>
      <text x="${x}" y="${markerTopY+16}" fill="${color}" font-size="9" text-anchor="middle" opacity="0.85">${numLabel}</text>
    `;
  }).join('');

  // Y-axis ticks
  const yTicks = [];
  for (let k = 0; k < 5; k++) {
    yTicks.push(yMin + (yMax - yMin) * (k / 4));
  }

  // X-axis time labels (adaptive based on window size)
  const xLabels = [];
  const intervalMin = displayCandles.length < 30 ? 5
    : displayCandles.length < 90 ? 10
    : displayCandles.length < 180 ? 30
    : 60;
  displayCandles.forEach((c, i) => {
    const jst = new Date((c.t + 9 * 3600) * 1000);
    const totalMin = jst.getUTCHours() * 60 + jst.getUTCMinutes();
    if (totalMin % intervalMin === 0) {
      const hh = String(jst.getUTCHours()).padStart(2,'0');
      const mm = String(jst.getUTCMinutes()).padStart(2,'0');
      xLabels.push({ i, t: `${hh}:${mm}` });
    }
  });

  return `
    <svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="none">
      <!-- Grid -->
      ${yTicks.map(v => `
        <line x1="${padL}" y1="${yPos(v)}" x2="${W-padR}" y2="${yPos(v)}" class="grid-line"/>
        <text x="${padL - 6}" y="${yPos(v) + 3}" class="axis-label" text-anchor="end">${Math.round(v).toLocaleString()}</text>
      `).join('')}
      <!-- BB bands -->
      <path d="${bbPath('bb3u','bb2u')}" fill="rgba(248,113,113,0.06)"/>
      <path d="${bbPath('bb2u','bb1u')}" fill="rgba(74,222,128,0.06)"/>
      <path d="${bbPath('bb1u','bb1l')}" fill="rgba(134,239,172,0.08)"/>
      <path d="${bbPath('bb1l','bb2l')}" fill="rgba(74,222,128,0.06)"/>
      <path d="${bbPath('bb2l','bb3l')}" fill="rgba(248,113,113,0.06)"/>
      ${bbLine('bb3u','#f87171','2 4')}
      ${bbLine('bb3l','#f87171','2 4')}
      ${bbLine('bb2u','#4ade80','3 3')}
      ${bbLine('bb2l','#4ade80','3 3')}
      ${bbLine('bb1u','#86efac','4 2')}
      ${bbLine('bb1l','#86efac','4 2')}
      ${bbLine('bbMid','#475569','5 2')}
      <!-- Subtle price area for context -->
      <defs>
        <linearGradient id="priceGrad-${stock.code}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${accent}" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="${accent}" stop-opacity="0.01"/>
        </linearGradient>
      </defs>
      <path d="${priceArea}" fill="url(#priceGrad-${stock.code})"/>
      <!-- Candlesticks (OHLC) -->
      ${candlesHtml}
      <!-- 5MA -->
      <path d="${maPath}" stroke="#facc15" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
      <!-- Trade markers -->
      ${tradeMarkers}
      <!-- X labels -->
      ${xLabels.map(l => `<text x="${xPos(l.i)}" y="${H-8}" class="axis-label" text-anchor="middle">${l.t}</text>`).join('')}
    </svg>
  `;
}
function renderTradeChart(stock, accentColor) {
  const trades = stock.trades.slice().sort((a,b) => a.idx - b.idx);
  if (trades.length === 0) return '';

  // Simple price-vs-trade-index line
  const prices = trades.map(t => t.price);
  const minP = Math.min(...prices);
  const maxP = Math.max(...prices);
  const range = maxP - minP || 1;
  const padR = range * 0.15;
  const yMin = minP - padR;
  const yMax = maxP + padR;

  const W = 680, H = 200;
  const padL = 50, padTop = 12, padBot = 22, padR_ = 10;
  const innerW = W - padL - padR_;
  const innerH = H - padTop - padBot;

  const xPos = i => padL + (trades.length === 1 ? innerW/2 : (i / (trades.length - 1)) * innerW);
  const yPos = p => padTop + innerH - ((p - yMin) / (yMax - yMin)) * innerH;

  // Build path
  let path = '';
  trades.forEach((t, i) => {
    const x = xPos(i), y = yPos(t.price);
    path += (i === 0 ? `M ${x} ${y}` : ` L ${x} ${y}`);
  });

  // Y axis labels (5 ticks)
  const yTicks = [];
  for (let k = 0; k < 5; k++) {
    const v = yMin + (yMax - yMin) * (k / 4);
    yTicks.push(v);
  }

  // Markers and labels
  const markers = trades.map((t, i) => {
    const x = xPos(i), y = yPos(t.price);
    const isWin = t.pnl !== null && t.pnl > 0;
    const isLoss = t.pnl !== null && t.pnl < 0;
    const color = isWin ? '#22c55e' : isLoss ? '#ef4444' : '#94a3b8';
    const sym = t.isBuy ? '▲' : '▼';
    const labelOffset = t.isBuy ? -8 : 14;
    return `
      <line x1="${x}" y1="${padTop}" x2="${x}" y2="${padTop+innerH}" stroke="${color}" class="trade-vline"/>
      <circle cx="${x}" cy="${y}" r="5" fill="${color}" stroke="${color === '#94a3b8' ? '#94a3b8' : '#0f172a'}" stroke-width="1.5"/>
      <text x="${x}" y="${y + labelOffset}" fill="${color}" class="trade-label" text-anchor="middle">${sym}</text>
    `;
  }).join('');

  return `
    <svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">
      ${yTicks.map(v => `
        <line x1="${padL}" y1="${yPos(v)}" x2="${W-padR_}" y2="${yPos(v)}" class="grid-line"/>
        <text x="${padL - 6}" y="${yPos(v) + 3}" class="axis-label" text-anchor="end">${Math.round(v).toLocaleString()}</text>
      `).join('')}
      <path d="${path}" stroke="${accentColor}" class="price-line"/>
      ${markers}
    </svg>
  `;
}

function fmtPnL(n) {
  if (n === null || n === undefined) return '--';
  const sign = n >= 0 ? '+' : '';
  return `${sign}${Math.round(n).toLocaleString()}`;
}

function describeTrade(t, stock) {
  const role = t.isOpen ? '新規' : '返済';
  const side = t.isBuy ? '買' : '売';
  return `${role}${side} ${t.qty}株 @${t.price.toLocaleString()}`;
}

      <div class="kpi">
        <div class="lbl">ペイオフレシオ</div>
        <div class="val ${kpis.payoff && kpis.payoff >= 1 ? 'green' : ''}">${kpis.payoff ? kpis.payoff.toFixed(2) : '--'}</div>
        <div class="sub">勝/負の比</div>
      </div>
      <div class="kpi">
        <div class="lbl">平均利益</div>
        <div class="val green">${fmtPnL(kpis.avgWin)}</div>
        <div class="sub">円</div>
      </div>
      <div class="kpi">
        <div class="lbl">平均損失</div>
        <div class="val red">${kpis.avgLoss ? '−' + Math.round(kpis.avgLoss).toLocaleString() : '--'}</div>
        <div class="sub">円</div>
      </div>
    </div>
  `;

  // ── Round trip detection ────────────────────────────────────────
  function findRoundTrips(stockTrades) {
    // FAST PATH: if trades have tripId (from 信用決済明細 format), group by it
    const hasTripIds = stockTrades.length > 0 && stockTrades[0].tripId != null;
    if (hasTripIds) {
      const byTrip = new Map();
      for (const t of stockTrades) {
        if (!byTrip.has(t.tripId)) byTrip.set(t.tripId, { opens: [], closes: [] });
        const trip = byTrip.get(t.tripId);
        if (t.isOpen) trip.opens.push(t);
        else if (t.isClose) trip.closes.push(t);
      }
      const tripList = [...byTrip.entries()]
        .sort((a, b) => a[0] - b[0])
        .map(([tripId, t], i) => {
          const totalOpenQty = t.opens.reduce((s, x) => s + x.qty, 0);
          const avgOpen = totalOpenQty ? t.opens.reduce((s, x) => s + x.qty * x.price, 0) / totalOpenQty : null;
          const avgClose = t.closes.length ? t.closes[0].price : null;
          const pnl = t.closes.reduce((s, x) => s + (x.pnl || 0), 0);
          const direction = t.opens[0]?.isBuy ? 'long' : 'short';
          return { num: i + 1, opens: t.opens, closes: t.closes, totalOpenQty, totalCloseQty: totalOpenQty, avgOpen, avgClose, pnl, direction };
        });
      return tripList;
    }

    // FALLBACK: FIFO (share-by-share) matching for legacy format
    const sorted = stockTrades.slice().sort((a, b) => a.idx - b.idx);
    const inventory = [];
    const trips = [];

    function recordClose(closeTrade, qty, matchedShares) {
      const opensMap = new Map();
      matchedShares.forEach(s => {
        const cur = opensMap.get(s.openIdx);
        if (cur) cur.qty += 1;
        else opensMap.set(s.openIdx, { trade: s.openTrade, qty: 1 });
      });
      const opens = [...opensMap.values()].map(o => ({ ...o.trade, qty: o.qty }));
      const direction = matchedShares[0].side;
      let pnl = 0;
      matchedShares.forEach(s => {
        pnl += direction === 'long' ? (closeTrade.price - s.price) : (s.price - closeTrade.price);
      });
      trips.push({ opens, closes: [{ ...closeTrade, qty }], pnl: Math.round(pnl), direction, qty });
    }

    for (const t of sorted) {
      if (t.isOpen) {
        const side = t.isBuy ? 'long' : 'short';
        for (let i = 0; i < t.qty; i++) {
          inventory.push({ side, price: t.price, openIdx: t.idx, openTrade: t });
        }
      } else if (t.isClose) {
        let remaining = t.qty;
        const matched = [];
        while (remaining > 0 && inventory.length > 0) {
          const expectedSide = t.isBuy ? 'short' : 'long';
          const idx = inventory.findIndex(s => s.side === expectedSide);
          if (idx < 0) break;
          matched.push(inventory.splice(idx, 1)[0]);
          remaining--;
        }
        if (matched.length > 0) {
          recordClose(t, t.qty - remaining, matched);
        }
      }
    }

    return trips.map((t, i) => {
      const totalOpenQty = t.qty;
      const avgOpen = t.opens.reduce((s, x) => s + x.qty * x.price, 0) / totalOpenQty;
      const avgClose = t.closes[0].price;
      return {
        num: i + 1,
        opens: t.opens,
        closes: t.closes,
        totalOpenQty,
        totalCloseQty: totalOpenQty,
        avgOpen,
        avgClose,
        pnl: t.pnl,
        direction: t.direction,
      };
    });
  }

  stocks.forEach((s, sIdx) => {
    const accent = accentColors[sIdx % accentColors.length];
    const trips = findRoundTrips(s.trades);
    const tradeCardsHtml = trips.map(trip => {
      const isLong = trip.direction === 'long';
      const arrow = isLong ? '買→売' : '売→買';
      const o = trip.avgOpen != null ? Math.round(trip.avgOpen).toLocaleString() : '--';
      const c = trip.avgClose != null ? Math.round(trip.avgClose).toLocaleString() : '--';
      const isWin = trip.pnl > 0;
      const isFlat = trip.pnl === 0;
      const cls = isFlat ? '' : (isWin ? 'win' : 'loss');
      const pnlCls = isFlat ? '' : (isWin ? 'win' : 'loss');
      return `
        <div class="trade-card ${cls}">
          <div class="trip-header">
            <span class="trip-num">${trip.num}</span>
            <span class="trip-detail">${arrow} ${o} → ${c} (${trip.totalOpenQty}株)</span>
          </div>
          <div class="val ${pnlCls}">${fmtPnL(trip.pnl)}円</div>
          <div class="note">${isLong ? 'ロング' : 'ショート'}決済</div>
        </div>
      `;
    }).join('');

    // Auto-generated candlestick chart (from Yahoo Finance data)
    const priceData = priceMap[s.code];
    const stockTimesForChart = (timesData && timesData[s.code]) || null;
    const autoChartHtml = priceData
      ? renderCandlestickChart(s, priceData, accent, stockTimesForChart)
      : '';
    const autoChartLegend = priceData ? `
      <div class="chart-legend">
        <span class="item"><span class="swatch" style="background:#facc15"></span>5MA</span>
        <span class="item" style="color:#475569"><span class="swatch dashed"></span>BB中心</span>
        <span class="item" style="color:#86efac"><span class="swatch dashed"></span>±1σ</span>
        <span class="item" style="color:#4ade80"><span class="swatch dashed"></span>±2σ</span>
        <span class="item" style="color:#f87171"><span class="swatch dashed"></span>±3σ</span>
        <span class="item" style="color:var(--muted); margin-left:auto">▲▼=取引位置（推定）</span>
      </div>
    ` : '';

    // Per-stock review note
    const stockNote = (notesData && notesData.stocks && notesData.stocks[s.code]) || '';
    const stockNoteHtml = stockNote ? `
      <div class="stock-note">
        <div class="stock-note-title">📝 ${s.name}の振り返り</div>
        <div class="notes-rendered">${renderMarkdown(stockNote)}</div>
      </div>
    ` : '';

    // Per-stock time editor rows
    const stockTimes = (timesData && timesData[s.code]) || {};
    const timeEditorRows = trips.map((trip, ti) => {
      const openKey = `${ti}-open`;
      const closeKey = `${ti}-close`;
      const openTime = stockTimes[openKey] || '';
      const closeTime = stockTimes[closeKey] || '';
      const arrow = trip.direction === 'long' ? '買→売' : '売→買';
      return `
        <div class="time-row">
          <span class="time-label">${ti+1}. ${arrow} ${Math.round(trip.avgOpen).toLocaleString()}→${Math.round(trip.avgClose).toLocaleString()}</span>
          <input type="time" data-code="${s.code}" data-key="${openKey}" value="${openTime}" class="time-input"/>
          <span class="time-sep">→</span>
          <input type="time" data-code="${s.code}" data-key="${closeKey}" value="${closeTime}" class="time-input"/>
        </div>
      `;
    }).join('');

    html += `
      <div class="stock-section">
        <div class="stock-header">
          <div>
            <span class="stock-name" style="color:${accent}">${s.name}</span>
            <span class="stock-meta">${s.code} ／ ${trips.length}回 ／ ${s.direction === 'short' ? 'ショート' : 'ロング'}</span>
          </div>
          <div class="stock-pnl ${s.totalPnL >= 0 ? 'green' : 'red'}">${fmtPnL(s.totalPnL)}円</div>
        </div>
        ${priceData ? `<div class="chart-area">${autoChartHtml}</div>${autoChartLegend}` : `
          <div class="chart-placeholder-card">
            <div class="chart-placeholder-icon">📊</div>
            <div class="chart-placeholder-text">価格データを取得中…<br/>CSVをpushすると自動でチャートが表示されます</div>
          </div>
        `}
        <div class="trade-cards">${tradeCardsHtml}</div>
        ${stockNoteHtml}
        <details class="time-editor">
          <summary>🕐 取引時刻を編集（▲▼の位置を補正）</summary>
          <div class="time-editor-body">
            <div class="time-editor-hint">各取引の建/決済時刻を入力すると、チャート上の▲▼が正確な位置に表示されます。空欄なら自動推定。</div>
            ${timeEditorRows}
          </div>
        </details>
      </div>
    `;
  });

  // Sticky save bar (shown when any time edit is made)
  html += `
    <div class="save-bar" id="save-bar" style="display:none;">
      <div class="save-bar-text">🕐 時刻が変更されました</div>
      <div class="save-bar-actions">
        <button class="save-btn" onclick="copyTimes()">JSONをコピー</button>
        <button class="save-btn secondary" onclick="downloadTimes()">DL</button>
      </div>
    </div>
  `;

  // Overall summary note + raw data
  const overallText = (notesData && notesData.overall) || '';
  const overallHtml = overallText
    ? `<div class="notes-rendered">${renderMarkdown(overallText)}</div>`
    : `<div class="notes-empty">
         <div class="notes-empty-icon">📝</div>
         <div class="notes-empty-text">総括メモがまだありません</div>
         <div class="notes-empty-hint">
           <code>data/notes/${date}.json</code> に下記の形式で保存：<br>
           <code>{"stocks":{"6857":"...","9984":"..."},"overall":"..."}</code>
         </div>
       </div>`;

  html += `
    <section class="notes-section">
      <div class="section-title">📊 全体総括</div>
      ${overallHtml}
    </section>
    <details>
      <summary>📋 約定明細を表示（${trades.length}件）</summary>
      <table class="raw-table">
        <thead><tr><th>銘柄</th><th>取引</th><th>数量</th><th>単価</th><th>損益</th></tr></thead>
        <tbody>
          ${trades.map(t => `
            <tr>
              <td>${t.name}</td>
              <td>${t.action}</td>
              <td style="text-align:right">${t.qty}</td>
              <td style="text-align:right">${t.price.toLocaleString()}</td>
              <td style="text-align:right" class="${t.pnl > 0 ? 'green' : t.pnl < 0 ? 'red' : ''}">${t.pnl !== null ? fmtPnL(t.pnl) : '--'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </details>
  `;

  app.innerHTML = html;

  // Init manual times state (for editor)
  if (!window.__manualTimes) window.__manualTimes = {};
  // Merge loaded times so the editor shows current state
  if (timesData) {
    for (const [code, times] of Object.entries(timesData)) {
      window.__manualTimes[code] = { ...(window.__manualTimes[code] || {}), ...times };
    }
  }

  // Wire up time inputs
  document.querySelectorAll('.time-input').forEach(input => {
    input.addEventListener('change', e => {
      const code = e.target.dataset.code;
      const key = e.target.dataset.key;
      const val = e.target.value;
      if (!window.__manualTimes[code]) window.__manualTimes[code] = {};
      if (val) window.__manualTimes[code][key] = val;
      else delete window.__manualTimes[code][key];
      document.getElementById('save-bar').style.display = 'flex';
    });
  });
}

// ═══════════════════════════════════════════════════════════════════
// Time save handlers
// ═══════════════════════════════════════════════════════════════════
function buildTimesJson() {
  const clean = {};
  for (const [code, times] of Object.entries(window.__manualTimes || {})) {
    if (Object.keys(times).length > 0) clean[code] = times;
  }
  return JSON.stringify(clean, null, 2);
}

async function copyTimes() {
  const json = buildTimesJson();
  const filename = `${window.__currentDate}.json`;
  try {
    await navigator.clipboard.writeText(json);
    alert(`✓ コピーしました！\n\nリポジトリの data/times/${filename} に貼り付けてコミットしてください。\n（フォルダがなければ "data/times/${filename}" として新規作成）`);
  } catch (e) {
    alert('コピー失敗。ダウンロードを試してください。');
  }
}

function downloadTimes() {
  const json = buildTimesJson();
  const filename = `${window.__currentDate}.json`;
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

window.copyTimes = copyTimes;
window.downloadTimes = downloadTimes;

// ═══════════════════════════════════════════════════════════════════
// Boot
// ═══════════════════════════════════════════════════════════════════
const status = document.getElementById('status');

async function loadFromUrl(url) {
  try {
    status.textContent = `${url} を読込中…`;
    console.log('[day] Fetching:', url);
    const res = await fetch(url);
    console.log('[day] Response:', res.status, res.ok);
    if (!res.ok) throw new Error(`HTTP ${res.status} (${url})`);
    const buf = await res.arrayBuffer();
    console.log('[day] Buffer size:', buf.byteLength);
    const trades = await parseSBICsv(buf);
    console.log('[day] Parsed trades:', trades.length);
    await render(trades);
    status.textContent = `✓ ${trades.length}件のデータを表示中（ファイル: ${url.split('/').pop()}）`;
  } catch (err) {
    console.error('[day] loadFromUrl error:', err);
    status.textContent = `読込失敗: ${err.message}`;
    document.getElementById('app').innerHTML = `
      <div style="padding:20px; background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.4); border-radius:8px; margin:14px 0;">
        <div style="font-weight:bold; color:#ef4444; margin-bottom:8px;">⚠️ エラー詳細</div>
        <div style="font-size:11px; color:#e2e8f0; font-family:monospace; line-height:1.5; word-break:break-all;">
          URL: ${url}<br>
          Error: ${err.message}<br>
          Stack: ${(err.stack || '').slice(0, 300)}
        </div>
        <div style="font-size:11px; color:var(--muted); margin-top:10px;">
          → ブラウザで <a href="${url}" target="_blank" style="color:#60a5fa;">直接CSVを開く</a>
        </div>
      </div>`;
  }
}

document.getElementById('csvfile').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    const trades = await parseSBICsv(buf);
    await render(trades);
    status.textContent = `✓ ${trades.length}件読込（${file.name}）`;
  } catch (err) {
    status.textContent = `エラー: ${err.message}`;
  }
});

// Support ?date=YYYY-MM-DD or ?csv=path/to/file.csv
const urlParams = new URLSearchParams(location.search);
const dateParam = urlParams.get('date');
const csvParam = urlParams.get('csv');
const today = new Date().toISOString().slice(0, 10);

if (dateParam) {
  loadFromUrl(`data/${dateParam}.csv`);
} else if (csvParam) {
  loadFromUrl(csvParam);
} else {
  // Try common date filenames
  const candidates = [
    `data/${today}.csv`,
    'data/2026-04-24.csv',
    'data/latest.csv',
  ];
  (async () => {
    for (const url of candidates) {
      try {
        const res = await fetch(url, { method: 'HEAD' });
        if (res.ok) { loadFromUrl(url); return; }
      } catch(e) {}
    }
    await render(null);
  })();
}
</script>
